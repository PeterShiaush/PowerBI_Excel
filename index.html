<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sample - Profit by Country Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 自訂 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="header">
        <h1>Financial Sample — 視覺 3：依國家/地區劃分的利潤</h1>
        <p>點擊表格中的國家，地圖將自動平移並聚焦 (Click row to focus map)</p>
    </div>

    <div class="dashboard-grid">
        <!-- 地圖區域 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📍 利潤地理分佈圖 (Profit Map)</div>
                <button class="btn-reset" onclick="resetMapView()">🌐 重置全景</button>
            </div>
            <div id="map"></div>
        </div>

        <!-- 表格區域 -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📊 各國利潤排名與占比（點擊國家可聚焦）</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>國家 / 地區</th>
                        <th class="num-col">Profit 的總和 (USD)</th>
                        <th class="num-col">占比</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- 由 JavaScript 動態生成帶有點擊事件的表格內容 -->
                </tbody>
                <tfoot>
                    <tr style="font-weight: bold; background-color: #f8f9fa;">
                        <td colspan="2">總計 (Total)</td>
                        <td class="num-col">$14,778,947.38</td>
                        <td class="num-col">100.00%</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 全域地圖設定點
        const initialCenter = [30, 0];
        const initialZoom = 2;

        // 初始化地圖
        const map = L.map('map', {
            center: initialCenter,
            zoom: initialZoom,
            zoomSnap: 0.5
        });

        // 載入地圖底圖
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 各國資料與精準座標點
        const countryData = [
            { id: "france", rank: 1, badgeClass: "rank-1", name: "France (法國)", rawName: "France", lat: 46.2276, lng: 2.2137, zoom: 5, profit: "$3,319,782.41", rawProfit: 3319782.41, share: "22.46%" },
            { id: "canada", rank: 2, badgeClass: "rank-2", name: "Canada (加拿大)", rawName: "Canada", lat: 56.1304, lng: -106.3468, zoom: 4, profit: "$3,207,361.86", rawProfit: 3207361.86, share: "21.70%" },
            { id: "germany", rank: 3, badgeClass: "rank-3", name: "Germany (德國)", rawName: "Germany", lat: 51.1657, lng: 10.4515, zoom: 5, profit: "$3,120,950.45", rawProfit: 3120950.45, share: "21.12%" },
            { id: "mexico", rank: 4, badgeClass: "", name: "Mexico (墨西哥)", rawName: "Mexico", lat: 23.6345, lng: -102.5528, zoom: 5, profit: "$2,569,833.80", rawProfit: 2569833.80, share: "17.39%" },
            { id: "usa", rank: 5, badgeClass: "", name: "United States of America (美國)", rawName: "United States of America", lat: 37.0902, lng: -95.7129, zoom: 4, profit: "$2,561,018.87", rawProfit: 2561018.87, share: "17.33%" }
        ];

        const mapMarkers = {};

        // 1. 繪製地圖圓圈標記
        countryData.forEach(item => {
            const radius = Math.sqrt(item.rawProfit) * 220;

            const circle = L.circle([item.lat, item.lng], {
                color: '#2563eb',
                fillColor: '#3b82f6',
                fillOpacity: 0.5,
                weight: 2,
                radius: radius
            }).addTo(map);

            const popupContent = `
                <div style="font-size:14px; padding:2px;">
                    <strong style="color:#1e3a8a;">${item.name}</strong><br/>
                    <span style="color:#475569;">Profit 的總和:</span> <strong>${item.profit}</strong><br/>
                    <span style="color:#475569;">占比:</span> <strong>${item.share}</strong>
                </div>
            `;

            circle.bindPopup(popupContent, { offset: [0, -5], autoPan: false });

            circle.on('click', () => {
                focusCountry(item.id, false);
            });

            mapMarkers[item.id] = { circle, data: item };
        });

        // 2. 動態渲染表格並加入點擊事件
        const tbody = document.getElementById('table-body');
        countryData.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = 'clickable-row';
            tr.id = `row-${item.id}`;
            tr.innerHTML = `
                <td><span class="rank-badge ${item.badgeClass}">${item.rank}</span></td>
                <td>${item.name}</td>
                <td class="num-col">${item.profit}</td>
                <td class="num-col">${item.share}</td>
            `;
            
            tr.addEventListener('click', () => {
                focusCountry(item.id, true);
            });

            tbody.appendChild(tr);
        });

        // 3. 聚焦國家函數 (FlyTo Animation)
        function focusCountry(countryId, flyMap = true) {
            const target = mapMarkers[countryId];
            if (!target) return;

            document.querySelectorAll('tbody tr').forEach(row => row.classList.remove('active-row'));
            
            const targetRow = document.getElementById(`row-${countryId}`);
            if (targetRow) targetRow.classList.add('active-row');

            if (flyMap) {
                map.flyTo([target.data.lat, target.data.lng], target.data.zoom, {
                    duration: 1.2,
                    easeLinearity: 0.25
                });
            }

            setTimeout(() => {
                target.circle.openPopup();
            }, flyMap ? 800 : 0);
        }

        // 4. 重置地圖至全景視角
        function resetMapView() {
            document.querySelectorAll('tbody tr').forEach(row => row.classList.remove('active-row'));
            map.closePopup();
            map.flyTo(initialCenter, initialZoom, { duration: 1 });
        }
    </script>
</body>
</html>
